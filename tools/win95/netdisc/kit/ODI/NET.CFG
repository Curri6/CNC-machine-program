; NET.CFG for Intel's DOS ODI driver (E100BODI.COM), used by C:\NETUP.
; Ethernet_II comes first because that is the frame type TCP/IP uses.
; Larger LSL buffers so full-size (1514-byte) Ethernet packets fit.

Link Support
	Buffers 8 1600
	MemPool 4096

Link Driver E100BODI
	Frame Ethernet_II
	Frame Ethernet_802.2
	Frame Ethernet_802.3
	Frame Ethernet_SNAP
